<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
  </style>
  <script>
    function showPage(pageId) {
      document.querySelectorAll('[data-page]').forEach(function(el) { el.style.display = 'none'; });
      var t = document.getElementById(pageId) || document.querySelector('[data-page="'+pageId+'"]');
      if (t) t.style.display = '';
    }
  </script>
</head>
<body>
<style>
  .todo-shadow { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
  .brand-bg { background-color: #DC0000; }
  .brand-text { color: #DC0000; }
  .brand-border { border-color: #DC0000; }
</style>

<div class="min-h-screen bg-gray-100 p-4 md:p-8">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl todo-shadow p-6 md:p-8">
      <div class="flex items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Todo App</h1>
          <p class="text-gray-600 mt-1">Add, complete, and delete your tasks.</p>
        </div>
        <div class="brand-bg text-white px-4 py-2 rounded-xl text-sm font-semibold">
          <span id="taskCountBadge">0 Tasks</span>
        </div>
      </div>

      <form id="todoForm" class="flex flex-col sm:flex-row gap-3 mb-6">
        <div class="flex-1">
          <label for="todoInput" class="sr-only">New task</label>
          <input
            id="todoInput"
            type="text"
            placeholder="Enter a new task..."
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-500"
            maxlength="120"
          />
          <p id="todoError" class="text-sm text-red-600 mt-2 hidden"></p>
        </div>
        <button
          type="submit"
          class="brand-bg hover:opacity-90 text-white font-semibold px-5 py-3 rounded-xl transition"
        >
          Add Task
        </button>
      </form>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6 text-sm">
        <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
          <div class="text-gray-500">Total</div>
          <div id="totalCount" class="text-2xl font-bold text-gray-900">0</div>
        </div>
        <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
          <div class="text-gray-500">Completed</div>
          <div id="completedCount" class="text-2xl font-bold text-green-600">0</div>
        </div>
        <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
          <div class="text-gray-500">Remaining</div>
          <div id="remainingCount" class="text-2xl font-bold brand-text">0</div>
        </div>
      </div>

      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-800">Your Tasks</h2>
        <button
          id="clearCompletedBtn"
          type="button"
          class="text-sm border brand-border brand-text px-3 py-2 rounded-lg hover:bg-red-50 transition"
        >
          Clear Completed
        </button>
      </div>

      <div id="emptyState" class="text-center py-10 text-gray-500 border-2 border-dashed border-gray-200 rounded-2xl">
        No tasks yet. Add your first todo above.
      </div>

      <ul id="todoList" class="space-y-3"></ul>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo_app_items_v1';
  let todos = [];

  function loadTodos() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      todos = saved ? JSON.parse(saved) : [
        { id: Date.now() + 1, text: 'Buy groceries', completed: false },
        { id: Date.now() + 2, text: 'Finish project update', completed: true }
      ];
      saveTodos();
    } catch (e) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function showError(message) {
    const errorEl = document.getElementById('todoError');
    errorEl.textContent = message;
    errorEl.classList.remove('hidden');
  }

  function clearError() {
    const errorEl = document.getElementById('todoError');
    errorEl.textContent = '';
    errorEl.classList.add('hidden');
  }

  function addTodo(text) {
    const trimmed = text.trim();
    if (!trimmed) {
      showError('Please enter a task before adding.');
      return false;
    }

    if (trimmed.length > 120) {
      showError('Task must be 120 characters or fewer.');
      return false;
    }

    todos.unshift({
      id: Date.now() + Math.floor(Math.random() * 1000),
      text: trimmed,
      completed: false
    });

    saveTodos();
    renderTodos();
    clearError();
    return true;
  }

  function toggleTodo(id) {
    todos = todos.map(todo =>
      todo.id === id ? { ...todo, completed: !todo.completed } : todo
    );
    saveTodos();
    renderTodos();
  }

  function deleteTodo(id) {
    todos = todos.filter(todo => todo.id !== id);
    saveTodos();
    renderTodos();
  }

  function clearCompleted() {
    todos = todos.filter(todo => !todo.completed);
    saveTodos();
    renderTodos();
  }

  function updateStats() {
    const total = todos.length;
    const completed = todos.filter(todo => todo.completed).length;
    const remaining = total - completed;

    document.getElementById('totalCount').textContent = total;
    document.getElementById('completedCount').textContent = completed;
    document.getElementById('remainingCount').textContent = remaining;
    document.getElementById('taskCountBadge').textContent = total + (total === 1 ? ' Task' : ' Tasks');
  }

  function renderTodos() {
    const list = document.getElementById('todoList');
    const emptyState = document.getElementById('emptyState');
    list.innerHTML = '';

    if (todos.length === 0) {
      emptyState.classList.remove('hidden');
    } else {
      emptyState.classList.add('hidden');
    }

    todos.forEach(todo => {
      const li = document.createElement('li');
      li.className = 'bg-gray-50 border border-gray-200 rounded-2xl p-4 flex items-center justify-between gap-3';

      const left = document.createElement('div');
      left.className = 'flex items-center gap-3 flex-1 min-w-0';

      const checkbox = document.createElement('button');
      checkbox.type = 'button';
      checkbox.setAttribute('aria-label', todo.completed ? 'Mark as incomplete' : 'Mark as complete');
      checkbox.className = 'w-6 h-6 rounded-full border-2 flex items-center justify-center transition ' +
        (todo.completed ? 'brand-bg brand-border text-white' : 'border-gray-300 bg-white text-transparent');
      checkbox.onclick = function() { toggleTodo(todo.id); };
      checkbox.innerHTML = todo.completed ? '&#10003;' : '&#10003;';

      const text = document.createElement('div');
      text.className = 'text-gray-800 break-words ' + (todo.completed ? 'line-through text-gray-400' : '');
      text.textContent = todo.text;

      left.appendChild(checkbox);
      left.appendChild(text);

      const actions = document.createElement('div');
      actions.className = 'flex items-center gap-2';

      const completeBtn = document.createElement('button');
      completeBtn.type = 'button';
      completeBtn.className = 'text-sm px-3 py-2 rounded-lg ' +
        (todo.completed ? 'bg-yellow-100 text-yellow-800 hover:bg-yellow-200' : 'bg-green-100 text-green-800 hover:bg-green-200');
      completeBtn.textContent = todo.completed ? 'Undo' : 'Complete';
      completeBtn.onclick = function() { toggleTodo(todo.id); };

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'text-sm px-3 py-2 rounded-lg bg-red-100 text-red-700 hover:bg-red-200';
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = function() { deleteTodo(todo.id); };

      actions.appendChild(completeBtn);
      actions.appendChild(deleteBtn);

      li.appendChild(left);
      li.appendChild(actions);
      list.appendChild(li);
    });

    updateStats();
  }

  document.getElementById('todoForm').onsubmit = function(event) {
    event.preventDefault();
    const input = document.getElementById('todoInput');
    const added = addTodo(input.value);
    if (added) {
      input.value = '';
      input.focus();
    }
  };

  document.getElementById('clearCompletedBtn').onclick = function() {
    clearCompleted();
  };

  document.getElementById('todoInput').oninput = function() {
    if (this.value.trim()) {
      clearError();
    }
  };

  loadTodos();
  renderTodos();
</script>
</body>
</html>
